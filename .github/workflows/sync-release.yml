name: Sync release installers

# Triggered by krita-vc's notify-site.yml the moment a release is published
# there (repository_dispatch), or manually via workflow_dispatch for testing.
# Pulls the new installers into public/download/, bumps APP_VERSION in
# lib/content.ts, verifies the build, and pushes straight to main (Vercel
# redeploys from there).

on:
  repository_dispatch:
    types: [krita-vc-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'krita-vc release tag (e.g. app-v1.1.0). Leave empty for latest.'
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag & version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo zeru-sakamoto/krita-vc --limit 1 --json tagName -q '.[0].tagName')
          fi
          VERSION="${TAG#app-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f public/download/*.exe public/download/*.msi public/download/*.dmg \
                public/download/*.AppImage public/download/*.deb public/download/*.rpm \
                public/download/*.gz
          # No --pattern filter, so this also grabs kritavc-plugin.zip — it overwrites
          # public/download/kritavc-plugin.zip via --clobber, no separate step needed.
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo zeru-sakamoto/krita-vc \
            -D public/download --clobber

      - name: Bump APP_VERSION in content.ts
        run: |
          sed -i "s/const APP_VERSION = '.*';/const APP_VERSION = '${{ steps.release.outputs.version }}';/" lib/content.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps & verify build
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download lib/content.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync installers for krita-vc ${{ steps.release.outputs.tag }}"
            git push
          fi
